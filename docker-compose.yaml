services:

  philter:
    image: philterd/philter:4.0.0
    ports:
      - "8080:8080"
    environment:
      # Both are generated into .env; see README.md. Philter's bundled model finds names, so no
      # PhEye service is needed.
      PHILTER_ENCRYPTION_KEY: ${PHILTER_ENCRYPTION_KEY:?generate .env first, see README.md}
      PHILTER_BOOTSTRAP_API_KEY: ${PHILTER_BOOTSTRAP_API_KEY:?generate .env first, see README.md}
